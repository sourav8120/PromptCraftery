# Render deployment configuration for PromptCraftery Backend
# This is used for deploying the backend service on Render

# Services to deploy
services:
  - type: web
    name: promptcraftery-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    
    # Environment variables
    envVars:
      - key: PORT
        value: 5001
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
